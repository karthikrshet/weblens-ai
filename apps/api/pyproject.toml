[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "weblens-api"
version = "0.1.0"
description = "WebLens AI - Agentic Website Intelligence & Exploration API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "trafilatura>=1.8.0",
    "lxml>=5.1.0",
    "numpy>=1.26.4",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0.1",
    "openai>=1.14.0",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
